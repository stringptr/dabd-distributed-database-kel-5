# =============================================================================
# HAProxy — Integrasi ke stack utama tim (compose.yml root)
#
# Dipakai oleh service `haproxy` di compose.yml root. Berbeda dari
# haproxy/haproxy.cfg yang dipakai harness uji (test/compose.yml).
#
# Frontend (di dalam jaringan docker — container/app lain pakai `haproxy:5432` dst.):
#   haproxy:5432 -> tulis shard-1   haproxy:6432 -> baca shard-1
#   haproxy:5433 -> tulis shard-2   haproxy:6433 -> baca shard-2
#   haproxy:8404 -> stats
# Port host (mapping di compose): 6532, 6533, 6632, 6633, 8404
#
# Kedua node per shard ditaruh di SEMUA backend; peran dipisah oleh health
# check pg_is_in_recovery(): primary -> write, standby -> read. Saat failover
# (standby di-promote), traffic tulis otomatis pindah tanpa edit config.
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    external-check
    insecure-fork-wanted

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold obsolete 30s

frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

# --- SHARD 1 -----------------------------------------------------------------
frontend fe_shard1_write
    bind *:5432
    default_backend be_shard1_write

backend be_shard1_write
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_primary.sh
    server postgres-primary-1 postgres-primary-1:5432 check resolvers docker init-addr libc,none
    server postgres-primary-1-standby-1 postgres-primary-1-standby-1:5432 check resolvers docker init-addr libc,none

frontend fe_shard1_read
    bind *:6432
    default_backend be_shard1_read

backend be_shard1_read
    balance roundrobin
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_replica.sh
    server postgres-primary-1 postgres-primary-1:5432 check resolvers docker init-addr libc,none
    server postgres-primary-1-standby-1 postgres-primary-1-standby-1:5432 check resolvers docker init-addr libc,none

# --- SHARD 2 -----------------------------------------------------------------
frontend fe_shard2_write
    bind *:5433
    default_backend be_shard2_write

backend be_shard2_write
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_primary.sh
    server postgres-primary-2 postgres-primary-2:5432 check resolvers docker init-addr libc,none
    server postgres-primary-2-standby-1 postgres-primary-2-standby-1:5432 check resolvers docker init-addr libc,none

frontend fe_shard2_read
    bind *:6433
    default_backend be_shard2_read

backend be_shard2_read
    balance roundrobin
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_replica.sh
    server postgres-primary-2 postgres-primary-2:5432 check resolvers docker init-addr libc,none
    server postgres-primary-2-standby-1 postgres-primary-2-standby-1:5432 check resolvers docker init-addr libc,none
