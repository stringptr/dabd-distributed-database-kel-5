# =============================================================================
# Harness uji HAProxy — 2 shard (primary + standby per shard) + HAProxy.
# Tidak bergantung pada stack asli tim: dipakai untuk membuktikan sendiri
# read/write split, auto-switch saat primary mati, dan rejoin node lama.
#
# Jalankan dari folder repo:
#   docker compose -f haproxy/test/compose.yml up -d --build
#
# PENTING: port (5432/5433/6432/6433/8404) sama dengan stack asli —
# jangan jalankan harness bersamaan dengan compose utama tim.
# =============================================================================
name: haproxy-test

x-node: &node
  image: docker.io/postgres:18.6-alpine3.24
  restart: unless-stopped
  networks:
    - haproxy-test
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
    interval: 5s
    timeout: 5s
    retries: 30

x-pg-command: &pg-command
  - postgres
  - -c
  - wal_level=replica
  - -c
  - max_wal_senders=10
  - -c
  - max_replication_slots=10
  - -c
  - wal_keep_size=64MB
  - -c
  - listen_addresses=*

services:
  # ---------------------------------------------------------------------------
  # SHARD 1
  # ---------------------------------------------------------------------------
  pg-shard1-1:
    <<: *node
    container_name: pg-shard1-1
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
      PEERS: "pg-shard1-1 pg-shard1-2"
      NODE_NAME: pg-shard1-1
      BOOTSTRAP: initdb
    volumes:
      - shard1_node1:/var/lib/postgresql
      - ./init-primary.sh:/docker-entrypoint-initdb.d/1-init.sh:ro
      - ../../init/entrypoint-node.sh:/entrypoint-node.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-node.sh"]
    command: *pg-command

  pg-shard1-2:
    <<: *node
    container_name: pg-shard1-2
    depends_on:
      pg-shard1-1:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
      PEERS: "pg-shard1-1 pg-shard1-2"
      NODE_NAME: pg-shard1-2
      BOOTSTRAP: basebackup
    volumes:
      - shard1_node2:/var/lib/postgresql
      - ../../init/entrypoint-node.sh:/entrypoint-node.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-node.sh"]
    command: *pg-command

  # ---------------------------------------------------------------------------
  # SHARD 2
  # ---------------------------------------------------------------------------
  pg-shard2-1:
    <<: *node
    container_name: pg-shard2-1
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
      PEERS: "pg-shard2-1 pg-shard2-2"
      NODE_NAME: pg-shard2-1
      BOOTSTRAP: initdb
    volumes:
      - shard2_node1:/var/lib/postgresql
      - ./init-primary.sh:/docker-entrypoint-initdb.d/1-init.sh:ro
      - ../../init/entrypoint-node.sh:/entrypoint-node.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-node.sh"]
    command: *pg-command

  pg-shard2-2:
    <<: *node
    container_name: pg-shard2-2
    depends_on:
      pg-shard2-1:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/docker
      PEERS: "pg-shard2-1 pg-shard2-2"
      NODE_NAME: pg-shard2-2
      BOOTSTRAP: basebackup
    volumes:
      - shard2_node2:/var/lib/postgresql
      - ../../init/entrypoint-node.sh:/entrypoint-node.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint-node.sh"]
    command: *pg-command

  # ---------------------------------------------------------------------------
  # HAPROXY — routing read/write + health check peran node
  # ---------------------------------------------------------------------------
  haproxy:
    build:
      context: ..
      dockerfile: Dockerfile
    image: dabd-haproxy:local
    container_name: haproxy
    restart: unless-stopped
    depends_on:
      pg-shard1-1:
        condition: service_healthy
      pg-shard1-2:
        condition: service_healthy
      pg-shard2-1:
        condition: service_healthy
      pg-shard2-2:
        condition: service_healthy
    ports:
      - "5432:5432"   # tulis shard-1
      - "5433:5433"   # tulis shard-2
      - "6432:6432"   # baca shard-1
      - "6433:6433"   # baca shard-2
      - "8404:8404"   # stats
    volumes:
      - ../haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - haproxy-test

volumes:
  shard1_node1:
  shard1_node2:
  shard2_node1:
  shard2_node2:

networks:
  haproxy-test:
    driver: bridge
