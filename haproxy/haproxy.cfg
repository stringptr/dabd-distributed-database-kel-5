# =============================================================================
# HAProxy — Routing Read/Write untuk Distributed RDBMS (2 shard, master-slave)
#
# Arsitektur:
#   shard-1 : tulis -> hanya PRIMARY shard-1,  baca -> hanya STANDBY shard-1
#   shard-2 : tulis -> hanya PRIMARY shard-2,  baca -> hanya STANDBY shard-2
#
# Health check TOOL-AGNOSTIC: peran node dicek via SQL (pg_is_in_recovery()),
# bukan lewat API tool HA tertentu — jadi tetap berlaku untuk Patroni,
# pg_auto_failover, maupun promote manual. Varian Patroni ada di bagian bawah.
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    # Dibutuhkan untuk menjalankan script health-check eksternal
    external-check
    insecure-fork-wanted

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3
    # Server yang gagal check langsung putus koneksi kliennya (switch cepat saat failover)
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

# Re-resolve DNS Docker, supaya IP container yang di-recreate tidak bikin nyangkut
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold obsolete 30s

# --- Stats dashboard: bukti visual read/write routing & failover -------------
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

# =============================================================================
# SHARD 1
# =============================================================================
# TULIS shard-1 (port 5432) — hanya node yang sedang PRIMARY
frontend fe_shard1_write
    bind *:5432
    default_backend be_shard1_write

backend be_shard1_write
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_primary.sh
    # >>> SESUAIKAN nama host dengan service DB tim (lihat README, bagian Kontrak)
    server pg-shard1-1 pg-shard1-1:5432 check resolvers docker init-addr libc,none
    server pg-shard1-2 pg-shard1-2:5432 check resolvers docker init-addr libc,none

# BACA shard-1 (port 6432) — hanya node yang sedang STANDBY (round-robin)
frontend fe_shard1_read
    bind *:6432
    default_backend be_shard1_read

backend be_shard1_read
    balance roundrobin
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_replica.sh
    # >>> SESUAIKAN
    server pg-shard1-1 pg-shard1-1:5432 check resolvers docker init-addr libc,none
    server pg-shard1-2 pg-shard1-2:5432 check resolvers docker init-addr libc,none

# =============================================================================
# SHARD 2
# =============================================================================
# TULIS shard-2 (port 5433) — hanya node yang sedang PRIMARY
frontend fe_shard2_write
    bind *:5433
    default_backend be_shard2_write

backend be_shard2_write
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_primary.sh
    # >>> SESUAIKAN
    server pg-shard2-1 pg-shard2-1:5432 check resolvers docker init-addr libc,none
    server pg-shard2-2 pg-shard2-2:5432 check resolvers docker init-addr libc,none

# BACA shard-2 (port 6433) — hanya node yang sedang STANDBY (round-robin)
frontend fe_shard2_read
    bind *:6433
    default_backend be_shard2_read

backend be_shard2_read
    balance roundrobin
    option external-check
    external-check path "/usr/bin:/bin"
    external-check command /usr/local/bin/check_replica.sh
    # >>> SESUAIKAN
    server pg-shard2-1 pg-shard2-1:5432 check resolvers docker init-addr libc,none
    server pg-shard2-2 pg-shard2-2:5432 check resolvers docker init-addr libc,none

# =============================================================================
# VARIAN PATRONI (opsional) — pakai ini kalau tim memakai Patroni + etcd:
#   1. Comment blok `option external-check` / `external-check ...` di backend.
#   2. Ganti dengan dua baris berikut (REST API Patroni, default port 8008):
#        option httpchk GET /primary      # backend *_write  (atau /master)
#        option httpchk GET /replica      # backend *_read
#        http-check expect status 200
#        server pg-shard1-1 pg-shard1-1:5432 check port 8008 resolvers docker init-addr libc,none
#   Cukup ganti 2 baris per backend; frontend/port tidak berubah.
# =============================================================================
