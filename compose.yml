    entrypoint: ["/bin/bash", "-c"]
    command:
      [
        "while [ ! -s \"$$PGDATA/PG_VERSION\" ]; do echo 'Waiting for standby
          data to be ready...'; sleep 2; done; exec
          /usr/local/bin/docker-entrypoint.sh postgres",
      ]

networks:
  pg-network:
    driver: bridge
