      - listen_addresses=*
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U primary -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  init-primary-2-replica-1:
    image: docker.io/postgres:18.6-alpine3.24
    container_name: init-primary-2-replica-1
    depends_on:
      postgres-primary-2:
        condition: service_healthy
    environment:
      PGPASSWORD: standby
    volumes:
      - ./primary_2_replica_1_data:/var/lib/postgresql:z
    networks:
      - pg-network
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e

        chown -R postgres:postgres /var/lib/postgresql/
        if [ ! -s /var/lib/postgresql/18/docker/PG_VERSION ]; then
        echo "Membuat PostgreSQL Standby..."
        rm -rf /var/lib/postgresql/18/docker

        PGPASSWORD=standby gosu postgres pg_basebackup \
        -h postgres-primary-2 \
        -U standby \
        -D /var/lib/postgresql/18/docker/ \
        -Fp \
        -Xs \
        -P \
        -R \
        -S standby1

        else
        echo "Primary-2_Standby-1 sudah tersedia."
        fi

  postgres-primary-2-standby-1:
    image: docker.io/postgres:18.6-alpine3.24
    container_name: postgres-primary-2-standby-1
    restart: unless-stopped
    depends_on:
      init-primary-2-replica-1:
        condition: service_completed_successfully
    ports:
      - "5443:5432"
    volumes:
      - ./primary_2_replica_1_data:/var/lib/postgresql:z
    environment:
      POSTGRES_PASSWORD: standby
      PGDATA: /var/lib/postgresql/18/docker
    networks:
